<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>ZZ NovaDrill developer portal</title>
<style>
  :root {
    --accent: #E8651A;
    --accent-ink: #111111;
    --ink: #1d2226;
    --mute: #59636a;
    --line: #d9d6cf;
    --bg: #f6f5f2;
    --err: #9a3412;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 420px;
    padding: 30px 24px;
    background: #ffffff;
    border: 1px solid var(--line);
    border-top: 4px solid var(--accent);
    border-radius: 10px;
    box-shadow: 0 18px 40px rgba(20, 24, 28, 0.08);
  }
  .brand {
    margin: 0 0 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--mute);
    overflow-wrap: anywhere;
  }
  h1 { margin: 0 0 8px; font-size: clamp(20px, 5.4vw, 25px); line-height: 1.25; }
  .lede { margin: 0 0 22px; font-size: 15px; color: var(--mute); }
  label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
  input {
    display: block;
    width: 100%;
    padding: 13px 14px;
    font-family: inherit;
    font-size: 16px;
    color: var(--ink);
    background: #ffffff;
    border: 1px solid #b9b5ac;
    border-radius: 6px;
  }
  input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 14px 16px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  button[disabled] { opacity: 0.55; cursor: progress; }
  .err { margin: 14px 0 0; min-height: 24px; font-size: 14px; color: var(--err); }
  .foot { margin: 0; max-width: 420px; text-align: center; font-size: 12.5px; color: var(--mute); }
  .noscript { margin: 0; max-width: 420px; text-align: center; font-size: 14px; color: var(--err); }
  @media (max-width: 420px) {
    .card { padding: 24px 18px; border-radius: 8px; }
    body { padding: 16px 12px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="card" id="gate">
  <p class="brand">ZZ NovaDrill</p>
  <h1>Private, passcode protected</h1>
  <p class="lede">Enter the passcode you were given to open this developer portal.</p>
  <label for="pc">Passcode</label>
  <input id="pc" type="password" autocomplete="off" autocapitalize="none" autocorrect="off"
         spellcheck="false" aria-describedby="err" autofocus>
  <button id="go" type="button">Open the portal</button>
  <p class="err" id="err" role="alert"></p>
</main>

  var input = document.getElementById("pc");
  var button = document.getElementById("go");
  var errBox = document.getElementById("err");

  // Courtesy delay after a failed attempt: 1s, 2s, 4s and so on, capped at 30s.
  // This is NOT rate limiting. The ciphertext on this page is public, so anyone
  // who has the file can attack it offline as fast as their hardware allows. The
  // real defence is passcode length and the PBKDF2 iteration count. The delay only
  // stops a person sitting at the form from hammering it by hand.
  var waitMs = 1000;
  var busy = false;

  function say(text) { errBox.textContent = text; }

  function b64ToBytes(text) {
    var raw = atob(text);
    var out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) { out[i] = raw.charCodeAt(i); }
    return out;
  }

  async function decrypt(pw) {

    var base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);

      { name: "PBKDF2", salt: b64ToBytes(B.salt_b64), iterations: B.iterations, hash: "SHA-256" },
      base,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]

      { name: "AES-GCM", iv: b64ToBytes(B.iv_b64) },
      key,
      b64ToBytes(B.ct_b64)

    say("That passcode did not work. Try again in " + left + "s.");
    var timer = setInterval(function () {
      left -= 1;
      if (left > 0) {
        say("That passcode did not work. Try again in " + left + "s.");
        return;
      }
      clearInterval(timer);
      button.disabled = false;
      busy = false;
      say("That passcode did not work. Check it and try again.");
      input.focus();

  async function attempt() {
    if (busy) { return; }
    var pw = input.value.replace(/^\s+|\s+$/g, "");
    if (!pw) {
      say("Enter the passcode to continue.");
      input.focus();
      return;

    button.disabled = true;
    say("Checking...");

    try {
